project-types:
  - name: bin
    description: Executable binary
    icon: 🚀
    add-features: [B] # B
    compilers:
      features: [TT] # TT
      msvc-compiler:
        features: [MSVC] # MSVC
      cl:
        add-features: [CL] # CL TT
  - name: test
    description: Test binary
    icon: 🧪
    extends: bin
    # B
    compilers:
      features: [C]
      msvc-compiler:
        add-features: [TEST_MSVC] # C TEST_MSVC
      cl:
        add-features: [TEST_CL] # C TEST_CL


