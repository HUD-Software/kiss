project-types:
  - name: bin
    description: Executable binary
    icon: 💾
    linkers:
      add-features: [BIN_2]
      gold:
        add-features: [BIN_3]
    compilers:
      add-defines: [KISS_BIN] # Preprocessor definitions to add when compiling with this project
      clangcl:
        add-defines: [BIN_1]
        linkers:
          add-features: [BIN_4]
          ld:
            add-features: [BIN_5]
  # - name: lib
  #   description: Static library
  #   icon: 📦
  #   compilers:
  #     add-defines: [KISS_LIB] # Preprocessor definitions to add when compiling with this project
  # - name: dyn
  #   description: Dynamic library
  #   icon: 🧩
  #   compilers:
  #     add-defines: [KISS_DYN_LIB] # Preprocessor definitions to add when compiling with this project
  - name: test
    description: Test binary
    icon: 🧪
    extends: bin
    compilers:
      add-defines: [KISS_TEST]
    linkers:
      add-features: [TEST_1]
      ld:
        add-features: [TEST_2]
