profiles:
  - name: debug
    description: Debug profile with debug informations and no optimization
    icon: 🐞
    compilers:
      add-defines: [KISS_DEBUG]
      msvc-compiler:
        enable-features: [OPT_LEVEL_0, WINDOWS_DLL_RUNTIME_DEBUG]
    linkers:
      enable-features: [ENABLE_INCREMENTAL_LINK]
    project-types:
      dyn:
        compilers:
          enable-features: [DYNAMIC_LIBRARY_DEBUG]

  - name: release
    description: Release profile with optimizations and no debug informations
    icon: 🚀
    compilers:
      defines: [KISS_RELEASE]
      msvc-compiler:
        enable-features: [OPT_LEVEL_3, WINDOWS_DLL_RUNTIME_RELEASE]
    linkers:
      enable-features: [DISABLE_INCREMENTAL_LINK]
      msvc-linker:
        enable-features: [REMOVE_DEAD_CODE]
    project-types:
      dyn:
        compilers:
          enable-features: [DYNAMIC_LIBRARY_RELEASE]

  - name: asan
    description: AddressSanitizer profile
    icon: 🔍
    extends: debug
    compilers:
      defines: [KISS_ASAN]
      msvc-compiler:
        enable-features: [ASAN]
    project-types:
      dyn:
        compilers:
          # AddressSanitizer doesn't support linking with debug runtime libraries yet
          enable-features: [DYNAMIC_LIBRARY_RELEASE]
        linkers:
          enable-features: [XXX]

      lib:
        compilers:
          # AddressSanitizer doesn't support linking with debug runtime libraries yet
          enable-features: [DYNAMIC_LIBRARY_RELEASE]
