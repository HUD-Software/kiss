# NOTE:
# remove-flags is applicable only in the same level, it does not propagate to child project-types
# For exemple:
#   add-flags: [P1]
#   remove-flags: [P1, P2]
#   ld:
#    add-flags: [P2]
# In this example, the final flags for ld will be [P2] because P1 is removed in the common level,
# but P2 is not removed in the ld level.
# Why? because add-flags in ld take precedence over remove-flags in the common level,
# but remove-flags in ld does not take precedence over add-flags in the common level.
# In general case, remove-flags is only applicable in the same level, it does not propagate to child project-types.

