compilers:
  - name: msvc-compiler
    is_abstract: true
    features:
      # Optimizations
      - name: OPT_LEVEL_0
        description: No optimization
        flags: [/Od]
        enable-features: [A] # A
        linkers:
          enable-features: [B] # A B
          link:
            enable-features: [C] # A B C
          lld-link:
            enable-features: [D] # A B D

  # MSVC cl.exe compiler
  - name: cl
    extends: msvc-compiler
    features:
      - name: OPT_LEVEL_0
        enable-features: [E] # A
        linkers:
          # E A B
          link:
            features: [O]
            enable-features: [F] # O F
          #lld-link
          # E A B D

  # MSVC clang-cl compiler
  - name: clangcl
    extends: cl
    features:
      - name: OPT_LEVEL_0
        linkers:
          lld-link:
            enable-features: [D]
            disable-features: [A]
