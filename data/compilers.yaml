compilers:
  - name: msvc-compiler
    is_abstract: true
    features:
      # Optimizations
      - name: OPT_LEVEL_0
        description: No optimization
        flags: [/Od]
        enable-features: [A]
        linkers:
          enable-features: [B] # A B
          link:
            enable-features: [C]
          lld-link:
            enable-features: [D]

  # MSVC cl.exe compiler
  - name: cl
    extends: msvc-compiler
    features:
      - name: OPT_LEVEL_0
        enable-features: [E]
        features: [O]
        linkers:
          link:
            enable-features: [F]

  # MSVC clang-cl compiler
  - name: clangcl
    extends: cl
    features:
      - name: OPT_LEVEL_0
        linkers:
          lld-link:
            enable-features: [D]
            disable-features: [A]
