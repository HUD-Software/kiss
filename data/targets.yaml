targets:
  - name: x86_64-pc-windows-msvc
    icon: 💻
    arch: x86_64
    vendor: pc
    os: windows
    abi: msvc
    pointer-width: 64
    endianness: little
    supported-compilers: [clangcl, cl]
    default-compiler: cl
    linkers:
      enable-features: [TARGET_X64]
    compilers:
      clangcl:
        features:
          - name: ASAN
            linkers:
              enable-features: [LINK:msvcrt.lib]

  - name: i686-pc-windows-msvc
    icon: 💻
    arch: i686
    vendor: pc
    os: windows
    abi: msvc
    pointer-width: 32
    endianness: little
    supported-compilers: [clangcl, cl]
    default-compiler: cl
    linkers:
      enable-features: [TARGET_X86]
    compilers:
      clangcl:
        features:
          - name: ASAN
            linkers:
              enable-features: [LINK:msvcrt.lib]

  - name: x86_64-unknown-linux-gnu
    icon: 🐧
    arch: x86_64
    vendor: unknown
    os: linux
    abi: gnu
    pointer-width: 64
    endianness: little
    supported-compilers: [clang, gcc]
    default-compiler: clang
    linkers:
      enable-features: [TARGET_X64]

  - name: i686-unknown-linux-gnu
    icon: 🐧
    arch: i686
    vendor: unknown
    os: linux
    abi: gnu
    pointer-width: 32
    endianness: little
    supported-compilers: [clang, gcc]
    default-compiler: clang
    linkers:
      enable-features: [TARGET_X32]