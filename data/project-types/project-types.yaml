project-types:
  - name: bin
    description: Executable binary
    icon: 💾
    linkers:
      add-flags: [P1]
      remove-flags: [P1]
      ld:
        add-flags: [P2]
      gold:
        flags: [TT]
        add-flags: [P3, P1]
      
  - name: test
    description: Test binary
    icon: 🧪
    extends: bin
    linkers:
      add-flags: [C1]
      remove-flags: [P2, C3]
      ld:
        add-flags: [C2]
      gold:
        add-flags: [C3]

