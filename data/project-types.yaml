project-types:
  - name: bin
    description: Executable binary
    icon: 🚀
    enable-features: [T]
    compilers:
      defines: [KISS_BIN] # Preprocessor definitions to add when compiling with this project
      features: [X]
      msvc-compiler:
        defines: [BBD]
      cl:
        enable-features: [U]
    linkers:
      enable-features: [dd] # Linker feature to enable when compiling this project
      lld-link:
        enable-features: [dsssd]
  # - name: lib
  #   description: Static library
  #   icon: 📦
  #   compilers:
  #     enable-features: [] # Compiler feature to enable when compiling this project
  #     defines: [KISS_LIB] # Preprocessor definitions to add when compiling with this project
  #   linkers:
