project-types:
  - name: bin
    description: Executable binary
    icon: 💾
    linkers:
      add-features: [TEST_2]
      gold:
        add-features: [TEST_3]
    compilers:
      add-defines: [KISS_BIN] # Preprocessor definitions to add when compiling with this project
      clangcl:
        add-defines: [TEST]
        linkers:
          add-features: [TEST_2]
          ld:
            add-features: [TEST_3]
