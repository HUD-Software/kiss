  #     enable-features: [] # Compiler feature to enable when compiling this project
  #     defines: [KISS_DYN_LIB] # Preprocessor definitions to add when compiling with this project
  #   linkers:
  #     enable-features: [] # Linker feature to enable when compiling this project
  - name: test
    description: Test binary
    icon: 🧪
    extends: bin
    compilers:
      add-defines: [KISS_TEST]
      remove-defines: [KISS_BIN]
      features: [COMP_TEST]
      cl:
        add-defines: [KISS_TEST_CL]
      b:
        add-defines: [KISS_TEST_CL]
    linkers:
      add-defines: [KISS_TEST_L]
      remove-defines: [KISS_BIN_L]
      features: [COMP_TEST_L]
      link:
        add-defines: [KISS_TEST_LINK]
      bl:
        add-defines: [KISS_TEST_BL]
