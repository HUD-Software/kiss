project-types:
  - name: bin
    description: Executable binary
    icon: 💾
    linkers:
      add-flags: [P1, P4]
      remove-flags: [P1, P2]
      ld:
        add-flags: [P2, P3] # P2, P3, P4
      gold:
        flags: [TT]
        add-flags: [P3, P1] # TT, P1
        remove-flags: [P3]

  # TODO:
  # resolve_extends
  # For all linkers
  #   we merge common with parent linker, then we merge with linker

  - name: test
    description: Test binary
    icon: 🧪
    extends: bin
    linkers:
      add-flags: [C1]
      remove-flags: [P2, C3]
      ld:
        add-flags: [C2] # P3, P4, C1, C2
      gold:
        add-flags: [C3] # TT P1 C1 C3


